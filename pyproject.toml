[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution is "pixelbench-pi": the bare name "pixelbench" already
# belongs to an unrelated CPU-vs-GPU benchmark on PyPI. The import package
# and the command stay "pixelbench".
name = "pixelbench-pi"
version = "0.1.2"
description = "A pixel art FPS benchmark for the Raspberry Pi, with thermal and throttling telemetry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Renant Bernabé" }]
keywords = ["raspberry-pi", "benchmark", "fps", "pygame", "pixel-art", "arm", "sdl2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.21",
    "pygame>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
pixelbench = "pixelbench.cli:run"

[project.urls]
Homepage = "https://github.com/RenantDev/pixelbench-pi"
Repository = "https://github.com/RenantDev/pixelbench-pi"
Issues = "https://github.com/RenantDev/pixelbench-pi/issues"
Changelog = "https://github.com/RenantDev/pixelbench-pi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelbench"]

[tool.hatch.build.targets.sdist]
# Keep the source distribution small enough to be a pleasant one-line install.
# The demo clip is 1.7 MB and belongs to the README, not to the package.
exclude = ["docs/media", ".github"]

[tool.ruff]
# Ruff is used as a LINTER here, not as a formatter. Do not run `ruff format`:
# it would put each of the twelve sky colours on its own line and flatten the
# Bayer 4x4 matrix into a single column. In a renderer built on palettes and
# small matrices, the visual grouping of those literals is the documentation.
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E741",   # ambiguous variable names: Q, c, d are the notation of the physics
    "B008",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
